<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://docs.getgrist.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liens entre acteurs</title>
  <link rel="stylesheet" href="vendor/dsfr/dsfr.min.css">
  <link rel="stylesheet" href="vendor/dsfr/utility/icons/icons.min.css">
  <link rel="stylesheet" href="commun/page.css?v=2">
  <link rel="stylesheet" href="commun/barre.css?v=3">
  <link rel="stylesheet" href="commun/configuration.css?v=8">
  <link rel="stylesheet" href="commun/grist-public.css?v=1">
  <link rel="stylesheet" href="css/app.css?v=4">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <a class="fr-link gg-evitement" href="#gg-panneau">Aller au panneau des acteurs</a>
  <div id="entete"></div>
  <div id="gg-demo" class="fr-notice fr-notice--info" hidden>
    <div class="gg-marge">
      <div class="fr-notice__body">
        <p class="fr-notice__title">Mode démonstration : données fictives, rien n'est enregistré.</p>
      </div>
    </div>
  </div>
  <div id="gg-coque"></div>
  <main class="gg-cadre">
    <div class="gg-cote">
      <div id="gg-panneau" class="gg-panneau" tabindex="-1"><p>Chargement…</p></div>
      <div class="gg-pied">
        <button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-settings-5-line fr-btn--icon-left" id="gg-reglages" data-ecriture>Réglages</button>
        <button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-refresh-line fr-btn--icon-left" id="gg-actualiser">Actualiser</button>
        <label class="fr-label gg-theme-label" for="gg-theme">Thème</label>
        <select class="fr-select fr-select--sm gg-theme" id="gg-theme">
          <option value="auto">Auto</option>
          <option value="light">Clair</option>
          <option value="dark">Sombre</option>
        </select>
      </div>
    </div>
    <div class="gg-principal">
      <div class="gg-barre">
        <div class="gg-vues" role="group" aria-label="Vue">
          <button type="button" class="fr-btn fr-btn--sm" data-vue="graphe" aria-pressed="true">Graphe</button>
          <button type="button" class="fr-btn fr-btn--sm fr-btn--secondary" data-vue="organigramme" aria-pressed="false">Organigramme</button>
          <button type="button" class="fr-btn fr-btn--sm fr-btn--secondary" data-vue="positions" aria-pressed="false">Positions</button>
          <button type="button" class="fr-btn fr-btn--sm fr-btn--secondary" data-vue="liste" aria-pressed="false">Liste</button>
        </div>
        <div class="gg-mouvement">
          <p id="gg-statut" class="fr-text--xs gg-statut" aria-live="polite"></p>
          <button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-play-line fr-btn--icon-left" id="gg-animer" aria-pressed="false">Animer</button>
          <button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-refresh-line fr-btn--icon-left" id="gg-reorganiser" title="Recalculer la disposition du graphe">Réorganiser</button>
        </div>
      </div>
      <div id="gg-info" class="gg-info"></div>
      <div id="gg-graphe" class="gg-graphe" role="img" aria-label="Graphe des liens entre acteurs. La vue Liste en donne le contenu sous forme de tableaux."></div>
      <div id="gg-liste" class="gg-liste" hidden></div>
    </div>
  </main>
  <div id="pied"></div>
  <script src="vendor/echarts/echarts.min.js"></script>
  <script src="vendor/echarts/langFR.js"></script>
  <script src="commun/page-dsfr.js?v=3"></script>
  <script src="commun/page-editeur.js?v=1"></script>
  <script src="commun/barre.js?v=3"></script>
  <script src="commun/configuration.js?v=12"></script>
  <script src="commun/grist-public.js?v=1"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
